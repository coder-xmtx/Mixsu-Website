      <path d="M 72 0 L 0 0 0 72" fill="none" stroke="rgba(255,255,255,0.055)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1280" height="720" fill="url(#grid)"/>
  <g transform="skewX(-14)">
    <rect x="520" y="-80" width="90" height="880" fill="#f0a35e" opacity="0.16"/><rect x="660" y="-80" width="40" height="880" fill="#f0a35e" opacity="0.34"/><rect x="900" y="-80" width="180" height="880" fill="#f0a35e" opacity="0.08"/>
