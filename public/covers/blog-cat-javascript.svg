  <path d="M 30 30 v 34 M 30 30 h 34" fill="none" stroke="rgba(255,255,255,0.32)" stroke-width="2.5"/><path d="M 1250 30 v 34 M 1250 30 h 34" fill="none" stroke="rgba(255,255,255,0.32)" stroke-width="2.5"/><path d="M 30 690 v 34 M 30 690 h 34" fill="none" stroke="rgba(255,255,255,0.32)" stroke-width="2.5"/><path d="M 1250 690 v 34 M 1250 690 h 34" fill="none" stroke="rgba(255,255,255,0.32)" stroke-width="2.5"/>
